<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0F2237">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; media-src blob: data:; connect-src https://api.openai.com https://generativelanguage.googleapis.com https://api.anthropic.com; worker-src blob: https://cdnjs.cloudflare.com; base-uri 'none'; form-action 'none'">
<meta name="author" content="Fernando Borrás Rocher; Susana Fernández de Ávila">
<meta name="description" content="Problemas de análisis de circuitos con esquema y solución calculada: cada estudiante, su propio ejercicio">
<title>CircuitIA · Problemas de análisis de circuitos con esquema y solución calculada: cada estudiante, su propio ejercicio</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --tinta:#0F2237; --acero:#2E4B6B; --acero-claro:#7C93AC; --gris:#5D7691;
  --papel:#F3F6FA; --blanco:#FFFFFF; --linea:#D8E0E9; --linea-2:#E8EEF4;
  --brasa:#E4572E; --brasa-osc:#C9441F; --brasa-suave:#FDEBE4;
  --forjado:#0E7C6B; --forjado-suave:#E0F3EE; --aviso:#8A3617;
  --c-ctx:#1F6FB2; --c-comp:#6B4FD8; --c-rda:#0E8C7A; --c-tema:#C98200; --c-eval:#E4572E; --c-final:#2E4B6B;
  --sombra:0 1px 0 rgba(15,34,55,.05), 0 14px 34px -22px rgba(15,34,55,.45);
  --sombra-alta:0 2px 0 rgba(15,34,55,.04), 0 22px 50px -24px rgba(15,34,55,.55);
  --r:14px;
  --display:"Bricolage Grotesque",Georgia,serif;
  --texto:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);font-family:var(--texto);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:84px}
a{color:var(--acero)}
:focus-visible{outline:3px solid var(--brasa);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
code{font-family:var(--mono);font-size:.85em;background:var(--linea-2);padding:1px 5px;border-radius:5px}

/* Barra superior */
.topbar{position:sticky;top:0;z-index:40;background:var(--tinta);color:#EAF1F7;box-shadow:0 6px 24px -14px rgba(0,0,0,.6)}
.tb-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{background:none;border:0;color:#fff;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.03em;cursor:pointer;padding:2px 4px;display:flex;align-items:center;gap:8px}
.logo em{font-style:normal;color:var(--brasa)}
.logo .anv{width:30px;height:30px;border-radius:9px;background:var(--brasa);display:grid;place-items:center;color:#fff}
.stepper{flex:1;display:flex;align-items:center;justify-content:center;min-width:0}
.sdot{display:flex;align-items:center;gap:7px;background:none;border:0;color:#8FA7BE;font:600 13px var(--texto);padding:6px;cursor:pointer;border-radius:10px;white-space:nowrap}
.sdot:disabled{cursor:not-allowed;opacity:.45}
.sdot .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid #3E5C7D;font-size:12px;color:#A9C0D4;transition:all .2s}
.sdot .n svg{width:14px;height:14px}
.sdot[data-state="done"] .n{background:var(--forjado);border-color:var(--forjado);color:#fff}
.sdot[data-state="now"]{color:#fff}
.sdot[data-state="now"] .n{background:var(--brasa);border-color:var(--brasa);color:#fff;box-shadow:0 0 0 4px rgba(228,87,46,.25)}
.sdot:not(:disabled):hover{background:rgba(255,255,255,.06)}
.sline{flex:0 1 26px;height:2px;background:#2F4A68;min-width:6px}
.sline.on{background:var(--forjado)}
.tb-tools{display:flex;gap:6px}
.tb-btn{background:transparent;border:1px solid #3E5C7D;color:#C9D8E6;border-radius:9px;padding:6px 10px;font:600 13px var(--texto);cursor:pointer;display:flex;align-items:center;gap:6px}
.tb-btn:hover{border-color:var(--brasa);color:#fff}
.progress{height:4px;background:#1E3550}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brasa),#F59E0B);transition:width .4s}
@media(max-width:960px){.sdot .lbl{display:none}.sdot[data-state="now"] .lbl{display:inline}}
@media(max-width:720px){
  .tb-in{flex-wrap:wrap;gap:8px}
  .stepper{order:3;flex-basis:100%;justify-content:space-between}
  .sdot[data-state="now"] .lbl{display:none}
  .tb-btn .lbl{display:none}
}

/* Pantallas */
main{max-width:1180px;margin:0 auto;padding:26px 16px 40px}
.screen{display:none}
.screen.on{display:block}
@media(prefers-reduced-motion:no-preference){.screen.on{animation:rise .35s cubic-bezier(.2,.7,.3,1) both}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
.sh{display:flex;gap:18px;align-items:flex-start;margin:4px 0 22px}
.sh-ico{width:64px;height:64px;border-radius:18px;background:var(--c,var(--brasa));color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 12px 24px -14px var(--c,var(--brasa))}
.sh-ico svg{width:32px;height:32px}
.sh-step{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acero-claro);margin:4px 0}
.sh h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,3.6vw,38px);letter-spacing:-.025em;line-height:1.05;margin:0 0 6px}
.sh-lede{margin:0;color:var(--gris);font-size:16.5px;max-width:70ch}
@media(max-width:600px){.sh-ico{width:48px;height:48px;border-radius:14px}.sh-ico svg{width:24px;height:24px}}

.card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra);padding:20px;margin-bottom:18px}
.card h3{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0 0 4px;display:flex;align-items:center;gap:9px}
.card h3 .num{width:26px;height:26px;border-radius:8px;background:var(--tinta);color:#fff;font:700 13px var(--mono);display:grid;place-items:center}
.card .sub{margin:0 0 14px;color:var(--gris);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.sticky{position:sticky;top:96px}
@media(max-width:900px){.cols{grid-template-columns:1fr}.sticky{position:static}}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

label,.lab{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px;color:var(--acero)}
label small,.lab small{font-weight:500;color:var(--acero-claro)}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;padding:11px 13px;border:1.5px solid var(--linea);border-radius:10px;font-family:var(--texto);font-size:15px;color:var(--tinta);background:#fff;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acero-claro);box-shadow:0 0 0 4px rgba(124,147,172,.18)}
input.bad{border-color:var(--brasa);box-shadow:0 0 0 4px rgba(228,87,46,.15)}
textarea{resize:vertical;min-height:96px;line-height:1.5}
input::placeholder,textarea::placeholder{color:#9DB0C2}
.field{margin-bottom:16px}
.help{font-size:12.8px;color:var(--gris);margin:6px 0 0}
.help b{color:var(--acero)}

button{font-family:var(--texto);cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;font-weight:600;font-size:15px;border:1.5px solid transparent;padding:11px 18px;transition:transform .08s,background .15s,border-color .15s;text-decoration:none;line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brasa);color:#fff;box-shadow:0 8px 18px -10px var(--brasa)}
.btn-primary:hover{background:var(--brasa-osc)}
.btn-big{font-size:17px;padding:14px 24px;border-radius:13px}
.btn-dark{background:var(--tinta);color:#fff}
.btn-dark:hover{background:#1c3656}
.btn-ghost{background:#fff;border-color:var(--linea);color:var(--acero)}
.btn-ghost:hover{border-color:var(--acero-claro);background:#F7FAFC}
.btn-ok{background:var(--forjado);color:#fff}
.btn-ok:hover{background:#0b6457}
.btn-word{background:#2B579A;color:#fff}
.btn-word:hover{background:#1e3f7a}
.btn-sm{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#fff;border:1.5px solid var(--linea);border-radius:999px;padding:7px 13px;font-size:13.5px;color:var(--acero);cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.25;text-align:left}
.chip:hover{border-color:var(--brasa);color:var(--brasa)}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.chip.mini-ex{font-size:12.5px;padding:4px 10px;border-style:dashed}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--linea);background:#fff;border-radius:9px;padding:7px 11px;font-size:13.5px;font-weight:600;color:var(--acero)}
.seg button:hover{border-color:var(--acero-claro)}
.seg button[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}

.meto{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.meto button{text-align:left;background:#fff;border:1.5px solid var(--linea);border-radius:12px;padding:10px 12px;color:var(--tinta)}
.meto button b{display:block;font-size:14px}
.meto button span{display:block;font-size:12.3px;color:var(--gris);line-height:1.35;margin-top:2px}
.meto button:hover{border-color:var(--acero-claro)}
.meto button[aria-pressed="true"]{border-color:var(--tinta);box-shadow:0 0 0 2px var(--tinta);background:var(--papel)}

.tip{display:flex;gap:12px;background:#FFF8E6;border:1px solid #F3DDA0;border-radius:12px;padding:13px 15px;font-size:14px;color:#6B4E00;margin-bottom:18px}
.tip svg{width:22px;height:22px;color:#C98200;flex:none;margin-top:1px}
.tip strong{color:#523B00}
.aviso{background:var(--brasa-suave);border:1px solid #F3C7B5;border-radius:12px;padding:13px 15px;font-size:14px;color:var(--aviso);margin-bottom:16px}
.okbox{background:var(--forjado-suave);border:1px solid #A9DCCF;border-radius:12px;padding:13px 15px;font-size:14px;color:#0B5A4E;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* Inicio */
.hero{background:var(--tinta);color:#EAF1F7;border-radius:22px;padding:40px 36px;position:relative;overflow:hidden;margin-bottom:26px;box-shadow:var(--sombra-alta)}
.hero::before{content:"";position:absolute;right:-80px;top:-80px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(228,87,46,.55),transparent 65%)}
.hero::after{content:"";position:absolute;left:30%;bottom:-140px;width:420px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(14,140,122,.35),transparent 65%)}
.hero>*{position:relative;z-index:1}
@media(max-width:600px){.hero{padding:28px 20px;border-radius:18px}}
.eyebrow{font:600 11.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#8FA7BE;margin:0 0 14px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,5.4vw,58px);line-height:.98;letter-spacing:-.035em;margin:0 0 16px;max-width:17ch}
.hero h1 em{font-style:normal;color:var(--brasa)}
.hero p.lede{max-width:62ch;font-size:18px;color:#C3D3E2;margin:0 0 24px}
.hero .actions .btn-ghost{background:transparent;color:#fff;border-color:#4A6787}
.hero .actions .btn-ghost:hover{border-color:#fff}
.draft{margin-top:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14.5px}
.sec-title{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:34px 0 6px}
.sec-sub{color:var(--gris);margin:0 0 16px}
.journey{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.jstop{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:16px;position:relative}
.jstop .ji{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c);margin-bottom:10px}
.jstop .ji svg{width:20px;height:20px}
.jstop b{display:block;font-size:15px;margin-bottom:2px}
.jstop span{display:block;font-size:13px;color:var(--gris);line-height:1.45}
.jstop .jn{position:absolute;top:12px;right:14px;font:700 12px var(--mono);color:var(--acero-claro)}
@media(max-width:900px){.journey{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.journey{grid-template-columns:1fr}}

.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.part{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:12px 14px}
.part .pi{width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);display:grid;place-items:center;flex:none}
.part b{display:block;font-size:14.5px}
.part span{display:block;font-size:12.8px;color:var(--gris);line-height:1.4}

.examples{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.excard{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sombra);position:relative;overflow:hidden;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}
.excard:hover{transform:translateY(-3px);box-shadow:var(--sombra-alta)}
.excard::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--c)}
.excard .emo{font-size:32px;line-height:1}
.excard .area{font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--acero-claro)}
.excard b{font-family:var(--display);font-size:18px;letter-spacing:-.01em;line-height:1.15}
.excard p{margin:0;font-size:13.5px;color:var(--gris);flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:999px;padding:3px 9px;align-self:flex-start}

/* Clave */
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;font-family:var(--mono);font-size:14px}
.eye{width:46px;flex:none;border:1.5px solid var(--linea);background:#fff;border-radius:10px;color:var(--acero);display:grid;place-items:center}
.light{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--papel);margin-top:14px;font-size:14.5px;font-weight:600}
.light .bulbo{width:14px;height:14px;border-radius:50%;background:#B8C5D3;box-shadow:0 0 0 4px rgba(184,197,211,.3);flex:none}
.light[data-s="ok"] .bulbo{background:#16A34A;box-shadow:0 0 0 4px rgba(22,163,74,.22)}
.light[data-s="err"] .bulbo{background:var(--brasa);box-shadow:0 0 0 4px rgba(228,87,46,.22)}
.light[data-s="wait"] .bulbo{background:#F59E0B;box-shadow:0 0 0 4px rgba(245,158,11,.25)}
.olsteps{list-style:none;padding:0;margin:0;counter-reset:o;display:flex;flex-direction:column;gap:12px}
.olsteps li{counter-increment:o;display:flex;gap:12px;font-size:14.5px;align-items:flex-start}
.olsteps li::before{content:counter(o);width:28px;height:28px;border-radius:50%;background:var(--brasa-suave);color:var(--brasa);font:700 13px var(--mono);display:grid;place-items:center;flex:none}

/* Acordeones */
.acc{background:#fff;border:1px solid var(--linea);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--sombra);overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;padding:15px 18px;display:flex;align-items:center;gap:12px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .ai{width:36px;height:36px;border-radius:10px;background:var(--papel);color:var(--acero);display:grid;place-items:center;flex:none}
.acc[open]>summary .ai{background:var(--tinta);color:#fff}
.acc>summary b{font-family:var(--display);font-size:17px;display:block}
.acc>summary small{display:block;color:var(--gris);font-size:13px}
.acc>summary .chev{margin-left:auto;transition:transform .2s;color:var(--acero-claro)}
.acc[open]>summary .chev{transform:rotate(180deg)}
.acc .inner{padding:4px 18px 18px;border-top:1px solid var(--linea-2)}
.acc .inner>*:first-child{margin-top:14px}
.prompt-ta{font-family:var(--mono);font-size:12.3px;min-height:130px;background:#FBFDFE}

/* Resumen lateral */
.sum h3{margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:var(--papel);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:800 24px var(--display);letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:12.3px;color:var(--gris)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks li{display:flex;gap:9px;align-items:center;color:var(--gris)}
.checks li .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--linea);display:grid;place-items:center;flex:none}
.checks li.on{color:var(--tinta)}
.checks li.on .ck{background:var(--forjado);border-color:var(--forjado);color:#fff}
.checks li .ck svg{width:12px;height:12px}
.docname{margin-top:14px;padding:11px 13px;border-radius:11px;background:var(--tinta);color:#C3D3E2;font-size:13.5px}
.docname b{color:#fff}

/* Generación */
.agents{display:flex;flex-direction:column;gap:10px}
.agent{background:#fff;border:1px solid var(--linea);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden;transition:border-color .2s}
.agent-h{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.agent .ai{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);display:grid;place-items:center;flex:none;transition:all .2s}
.agent .ai svg{width:20px;height:20px}
.agent-t{flex:1;min-width:0}
.agent-t b{display:block;font-family:var(--display);font-size:16.5px}
.agent-t span{display:block;font-size:13px;color:var(--gris)}
.pill{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--linea-2);color:var(--gris);white-space:nowrap}
.agent[data-s="run"]{border-color:#F59E0B}
.agent[data-s="run"] .ai{background:var(--c);color:#fff;animation:pulse 1s infinite alternate}
.agent[data-s="run"] .pill{background:#FFF1D6;color:#8A5A00}
.agent[data-s="ok"] .ai{background:var(--c);color:#fff}
.agent[data-s="ok"] .pill{background:var(--forjado-suave);color:var(--forjado)}
.agent[data-s="err"]{border-color:var(--brasa)}
.agent[data-s="err"] .pill{background:var(--brasa-suave);color:var(--brasa)}
.agent-b{display:none;padding:4px 18px 16px 72px;font-size:14px;border-top:1px solid var(--linea-2);background:#FBFDFE}
.agent.open .agent-b{display:block}
@media(max-width:600px){.agent-b{padding-left:18px}}
@keyframes pulse{from{transform:scale(1);box-shadow:0 0 0 0 rgba(228,87,46,.5)}to{transform:scale(1.06);box-shadow:0 0 0 10px rgba(228,87,46,0)}}
.forging{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;background:var(--tinta);color:#fff;margin-bottom:16px}
.forging .spark{width:44px;height:44px;border-radius:12px;background:var(--brasa);display:grid;place-items:center;flex:none;animation:pulse 1s infinite alternate}
.forging.done .spark{background:var(--forjado);animation:none}
.forging.err .spark{animation:none}

<script>const APP="circuitia";const APP_NAME="CircuitIA";const LOGO_ICON="cpu";
"use strict";
/* ── utilidades comunes (todas las apps Forja) ──────────────────────────────
   Requiere que la app defina antes:  const APP = 'miapp';  (prefijo de almacenamiento)  */
const $ = id => document.getElementById(id), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = (p = '') => p + Math.random().toString(36).slice(2, 8);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
const wc = s => (String(s || '').trim().match(/[\p{L}\p{N}]+/gu) || []).length;
const chunk = (a, n) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };
const nf = n => Math.round(n).toLocaleString('es-ES');
const mmss = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const slug = s => norm(s).replace(/ /g, '_').slice(0, 40) || 'x';
function toast(m, ms = 4200) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms); }
function dl(nombre, contenido, tipo) { const b = contenido instanceof Blob ? contenido : new Blob([contenido], {type: tipo}); const u = URL.createObjectURL(b); const a = document.createElement('a'); a.href = u; a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2500); }

/* librerías externas: solo desde cdnjs (la CSP no admite otros orígenes) */
const LIB = {
  mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
  jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfw: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  docx: 'https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.umd.min.js'
};
function cargaLib(urls) {
  return urls.reduce((p, u) => p.catch(() => new Promise((ok, ko) => { const s = document.createElement('script'); s.src = u; s.onload = ok; s.onerror = () => { s.remove(); ko(); }; document.head.appendChild(s); })), Promise.reject())
    .catch(() => { throw new Error('No se pudo cargar una librería: ¿hay conexión?'); });
}

/* huella SHA-256 (con alternativa para file:// sin contexto seguro) y canonización estable */
const canon = v => v === null || typeof v !== 'object' ? JSON.stringify(v) : Array.isArray(v) ? '[' + v.map(canon).join(',') + ']' : '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
function sha256js(bytes) {
  const pr = []; for (let n = 2; pr.length < 64; n++) if (pr.every(p => n % p)) pr.push(n);
  const fr = x => Math.floor((x - Math.floor(x)) * 4294967296), K = pr.map(p => fr(Math.cbrt(p))), H = pr.slice(0, 8).map(p => fr(Math.sqrt(p)));
  const l = bytes.length, pad = new Uint8Array(((l + 9 + 63) >> 6) << 6); pad.set(bytes); pad[l] = 0x80;
  const dv = new DataView(pad.buffer); dv.setUint32(pad.length - 8, Math.floor(l * 8 / 4294967296)); dv.setUint32(pad.length - 4, (l * 8) >>> 0);
  const rr = (x, n) => (x >>> n) | (x << (32 - n)), W = new Uint32Array(64);

   Convierte ## encabezados, listas y **negritas**; lo demás va como párrafos. */
async function wordDeMarkdown(md, {titulo = '', subtitulo = '', pie = '', kicker = ''} = {}) {
  await cargaLib([LIB.docx]); const X = window.docx;
  const runs = (tx, base = {}) => String(tx).split(/(\*\*[^*]+\*\*)/).filter(Boolean).map(p => p.startsWith('**') ? new X.TextRun({text: p.slice(2, -2), font: 'Arial', size: 22, bold: true, ...base}) : new X.TextRun({text: p, font: 'Arial', size: 22, ...base}));
  const P = (tx, o = {}) => new X.Paragraph({heading: o.h, alignment: o.c ? X.AlignmentType.CENTER : undefined, spacing: {after: o.after ?? 110}, indent: o.ind ? {left: o.ind} : undefined, children: o.plain ? [new X.TextRun({text: String(tx), font: 'Arial', size: o.s || 22, bold: o.b, italics: o.i, color: o.col})] : runs(tx, {italics: o.i, color: o.col})});
  const k = [];
  if (kicker) k.push(P(kicker.toUpperCase(), {c: true, b: true, col: 'E4572E', s: 20, plain: true}));
  if (titulo) k.push(P(titulo, {c: true, b: true, s: 32, plain: true}));
  if (subtitulo) k.push(P(subtitulo, {c: true, col: '5D7691', s: 20, after: 260, plain: true}));
  for (const l of String(md).split('\n')) {
    const t = l.trimEnd(); if (!t.trim()) continue; let m;
    if (m = t.match(/^#{1,4}\s+(.*)/)) k.push(P(m[1].replace(/\*\*/g, ''), {h: X.HeadingLevel.HEADING_1, plain: true}));
    else if (m = t.match(/^\s*[-*•]\s+(.*)/)) k.push(P('•  ' + m[1], {ind: 360, after: 60}));
    else if (m = t.match(/^\s*(\d+[.)])\s+(.*)/)) k.push(P(m[1] + '  ' + m[2], {ind: 360, after: 60}));
    else k.push(P(t));
  }
  if (pie) k.push(P(pie, {i: true, s: 16, col: '8899AA', plain: true}));
  return X.Packer.toBlob(new X.Document({creator: typeof APP_NAME === 'string' ? APP_NAME : APP, sections: [{children: k}]}));
}

 sol: {es: 'Sin carga, V_A = Vs·R2/(R1+R2) = {v0}. Con carga, R2 y RL quedan en paralelo y el divisor cambia: V_A = {vl}. Entonces I_L = V_A/RL = {il} y P_L = V_A·I_L = {pl}.', en: 'Unloaded, V_A = Vs·R2/(R1+R2) = {v0}. With the load, R2 and RL are in parallel and the divider changes: V_A = {vl}. Then I_L = V_A/RL = {il} and P_L = V_A·I_L = {pl}.'},
 oraculo: v => { const rp = v.R2 * v.RL / (v.R2 + v.RL), vl = v.Vs * rp / (v.R1 + rp); return {v0: v.Vs * v.R2 / (v.R1 + v.R2), vl, il: vl / v.RL, pl: sq(vl) / v.RL}; }},
{id: 'div-corriente', tema: 'resistivos', nivel: 1, titulo: {es: 'Divisor de corriente', en: 'Current divider'},
 enun: {es: 'Una fuente de corriente Is = {Is} alimenta tres resistencias en paralelo: R1 = {R1}, R2 = {R2} y R3 = {R3}. Calcula las corrientes por R1 y R2 (hacia abajo), la tensión del nudo A y la potencia en R3.', en: 'A current source Is = {Is} feeds three parallel resistors: R1 = {R1}, R2 = {R2} and R3 = {R3}. Find the currents through R1 and R2 (downward), the voltage at node A and the power in R3.'},
 params: {Is: {v: [0.005, 0.01, 0.012, 0.02, 0.05], u: 'A'}, R1: R12(100, 2200), R2: R12(100, 2200), R3: R12(100, 2200)},
 dsl: 'I Is 0,5 0,0 {Is}\nW 0,0 12,0\nR R1 4,0 4,5 {R1}\nR R2 8,0 8,5 {R2}\nR R3 12,0 12,5 {R3}\nW 0,5 12,5\nGND 6,5\nLBL 0,0 A',
 pedir: [{id: 'i1', nom: 'I_1', txt: {es: 'Corriente por R1', en: 'Current through R1'}, m: {t: 'I', e: 'R1'}, u: 'A'}, {id: 'i2', nom: 'I_2', txt: {es: 'Corriente por R2', en: 'Current through R2'}, m: {t: 'I', e: 'R2'}, u: 'A'}, {id: 'va', nom: 'V_A', txt: {es: 'Tensión del nudo A', en: 'Voltage at node A'}, m: {t: 'V', a: 'A', b: '0'}, u: 'V'}, {id: 'p3', nom: 'P_3', txt: {es: 'Potencia en R3', en: 'Power in R3'}, m: {t: 'P', e: 'R3'}, u: 'W'}],
 sol: {es: 'La conductancia total es G = 1/R1+1/R2+1/R3, de modo que V_A = Is/G = {va}. Cada rama toma I_k = V_A/R_k: I1 = {i1}, I2 = {i2}. P3 = V_A²/R3 = {p3}.', en: 'The total conductance is G = 1/R1+1/R2+1/R3, so V_A = Is/G = {va}. Each branch carries I_k = V_A/R_k: I1 = {i1}, I2 = {i2}. P3 = V_A²/R3 = {p3}.'},
 oraculo: v => { const G = 1 / v.R1 + 1 / v.R2 + 1 / v.R3, va = v.Is / G; return {i1: va / v.R1, i2: va / v.R2, va, p3: sq(va) / v.R3}; }},
{id: 'req-sp', tema: 'resistivos', nivel: 2, titulo: {es: 'Asociación serie-paralelo', en: 'Series-parallel network'},
 enun: {es: 'Con Vs = {Vs}, R1 = {R1}, R2 = {R2}, R3 = {R3} y R4 = {R4}, calcula la resistencia equivalente vista por la fuente, la corriente que entrega, la tensión V_A y la corriente por R4 (hacia abajo).', en: 'With Vs = {Vs}, R1 = {R1}, R2 = {R2}, R3 = {R3} and R4 = {R4}, find the equivalent resistance seen by the source, the current it delivers, the voltage V_A and the current through R4 (downward).'},
 params: {Vs: VS(6, 10, 12, 24), R1: R12(100, 2200), R2: R12(100, 4700), R3: R12(100, 2200), R4: R12(100, 2200)},
 dsl: 'V Vs 0,0 0,6 {Vs}\nR R1 0,0 4,0 {R1}\nR R2 4,0 4,6 {R2}\nW 4,0 9,0\nR R3 9,0 9,3 {R3}\nR R4 9,3 9,6 {R4}\nW 0,6 9,6\nGND 4,6\nLBL 4,0 A\nLBL 0,0 S',
 pedir: [{id: 'req', nom: 'R_eq', txt: {es: 'Resistencia equivalente vista por la fuente', en: 'Equivalent resistance seen by the source'}, m: {t: 'Req', a: 'S', b: '0', quitar: ['Vs']}, u: 'Ω'}, {id: 'i', nom: 'I', txt: {es: 'Corriente que entrega la fuente', en: 'Current delivered by the source'}, m: {t: 'I', e: 'R1'}, u: 'A'}, {id: 'va', nom: 'V_A', txt: {es: 'Tensión V_A', en: 'Voltage V_A'}, m: {t: 'V', a: 'A', b: '0'}, u: 'V'}, {id: 'i4', nom: 'I_4', txt: {es: 'Corriente por R4', en: 'Current through R4'}, m: {t: 'I', e: 'R4'}, u: 'A'}],
 errores: [{pid: ['req'], nom: {es: 'Has asociado R3 y R4 en paralelo; están en serie.', en: 'You put R3 and R4 in parallel; they are in series.'}, mut: {}}],
 sol: {es: 'R3 y R4 están en serie (R3+R4) y esa rama va en paralelo con R2; el conjunto queda en serie con R1: Req = {req}. I = Vs/Req = {i}, V_A = Vs − I·R1 = {va} e I4 = V_A/(R3+R4) = {i4}.', en: 'R3 and R4 are in series (R3+R4) and that branch is in parallel with R2; the result is in series with R1: Req = {req}. I = Vs/Req = {i}, V_A = Vs − I·R1 = {va} and I4 = V_A/(R3+R4) = {i4}.'},
 oraculo: v => { const rp = v.R2 * (v.R3 + v.R4) / (v.R2 + v.R3 + v.R4), req = v.R1 + rp, i = v.Vs / req, va = i * rp; return {req, i, va, i4: va / (v.R3 + v.R4)}; }},
{id: 'puente-w', tema: 'resistivos', nivel: 2, titulo: {es: 'Puente de Wheatstone no equilibrado', en: 'Unbalanced Wheatstone bridge'},
 enun: {es: 'En el puente de la figura, Vs = {Vs}, R1 = {R1}, R2 = {R2}, R3 = {R3}, R4 = {R4} y R5 = {R5}. Calcula la tensión V_AB, la corriente por R5 (de A a B), la potencia en R5 y la resistencia equivalente vista por la fuente.', en: 'In the bridge shown, Vs = {Vs}, R1 = {R1}, R2 = {R2}, R3 = {R3}, R4 = {R4} and R5 = {R5}. Find the voltage V_AB, the current through R5 (from A to B), the power in R5 and the equivalent resistance seen by the source.'},
 params: {Vs: VS(5, 10, 12, 15), R1: R12(100, 4700), R2: R12(100, 4700), R3: R12(100, 4700), R4: R12(100, 4700), R5: R12(100, 4700)},
 dsl: 'V Vs -3,-4 -3,4 {Vs}\nW -3,-4 5,-4\nW -3,4 5,4\nR R1 5,-4 0,0 {R1}\nR R2 5,-4 10,0 {R2}\nR R3 0,0 5,4 {R3}\nR R4 10,0 5,4 {R4}\nR R5 0,0 10,0 {R5}\nGND 5,4\nLBL 5,-4 S\nLBL 0,0 A\nLBL 10,0 B',
 pedir: [{id: 'vab', nom: 'V_AB', txt: {es: 'Tensión V_AB', en: 'Voltage V_AB'}, m: {t: 'V', a: 'A', b: 'B'}, u: 'V', noCero: true, escala: 1}, {id: 'i5', nom: 'I_5', txt: {es: 'Corriente por R5 (de A a B)', en: 'Current through R5 (A to B)'}, m: {t: 'I', e: 'R5'}, u: 'A'}, {id: 'p5', nom: 'P_5', txt: {es: 'Potencia en R5', en: 'Power in R5'}, m: {t: 'P', e: 'R5'}, u: 'W'}, {id: 'req', nom: 'R_eq', txt: {es: 'Resistencia equivalente vista por la fuente', en: 'Equivalent resistance seen by the source'}, m: {t: 'Req', a: 'S', b: '0', quitar: ['Vs']}, u: 'Ω'}],
 errores: [{pid: ['req'], nom: {es: 'Has tratado el puente como si estuviera equilibrado (sin R5).', en: 'You treated the bridge as balanced (ignoring R5).'}, mut: {abrir: ['R5']}}],
 sol: {es: 'Con tierra en la parte inferior, se plantea el método de los nudos en A y B. Resulta V_AB = {vab} e I5 = V_AB/R5 = {i5}. La fuente ve Req = {req} (no es serie-paralelo: hay que usar nudos o la transformación Δ–Y).', en: 'With ground at the bottom, nodal analysis at A and B gives V_AB = {vab} and I5 = V_AB/R5 = {i5}. The source sees Req = {req} (not series-parallel: use nodal analysis or a Δ–Y transform).'},
 oraculo: v => { const [A, B] = cramer(1 / v.R1 + 1 / v.R3 + 1 / v.R5, -1 / v.R5, -1 / v.R5, 1 / v.R2 + 1 / v.R4 + 1 / v.R5, v.Vs / v.R1, v.Vs / v.R2), is = (v.Vs - A) / v.R1 + (v.Vs - B) / v.R2; return {vab: A - B, i5: (A - B) / v.R5, p5: sq(A - B) / v.R5, req: v.Vs / is}; }},
{id: 'nudos-2', tema: 'metodos', nivel: 2, titulo: {es: 'Método de los nudos (dos nudos)', en: 'Nodal analysis (two nodes)'},
 enun: {es: 'Con Vs = {Vs}, Is = {Is}, R1 = {R1}, R2 = {R2}, R3 = {R3} y R4 = {R4}, calcula por el método de los nudos las tensiones V_A y V_B, la corriente por R3 (de A a B) y la potencia que entrega la fuente de tensión.', en: 'With Vs = {Vs}, Is = {Is}, R1 = {R1}, R2 = {R2}, R3 = {R3} and R4 = {R4}, use nodal analysis to find the voltages V_A and V_B, the current through R3 (from A to B) and the power delivered by the voltage source.'},
 params: {Vs: VS(6, 9, 12, 15, 24), Is: {v: [0.002, 0.005, 0.01], u: 'A'}, R1: R12(220, 4700), R2: R12(220, 4700), R3: R12(220, 4700), R4: R12(220, 4700)},
 dsl: 'V Vs 0,0 0,6 {Vs}\nR R1 0,0 5,0 {R1}\nR R2 5,0 5,6 {R2}\nR R3 5,0 10,0 {R3}\nR R4 10,0 10,6 {R4}\nW 10,0 14,0\nI Is 14,6 14,0 {Is}\nW 0,6 14,6\nGND 7,6\nLBL 5,0 A\nLBL 10,0 B',
 pedir: [{id: 'va', nom: 'V_A', txt: {es: 'Tensión V_A', en: 'Voltage V_A'}, m: {t: 'V', a: 'A', b: '0'}, u: 'V'}, {id: 'vb', nom: 'V_B', txt: {es: 'Tensión V_B', en: 'Voltage V_B'}, m: {t: 'V', a: 'B', b: '0'}, u: 'V'}, {id: 'i3', nom: 'I_3', txt: {es: 'Corriente por R3 (de A a B)', en: 'Current through R3 (A to B)'}, m: {t: 'I', e: 'R3'}, u: 'A'}, {id: 'ps', nom: 'P_s', txt: {es: 'Potencia que entrega la fuente de tensión', en: 'Power delivered by the voltage source'}, m: {t: 'P', e: 'Vs', neg: true}, u: 'W'}],
 sol: {es: 'Nudo A: (V_A−Vs)/R1 + V_A/R2 + (V_A−V_B)/R3 = 0. Nudo B: (V_B−V_A)/R3 + V_B/R4 = Is. Resolviendo: V_A = {va} y V_B = {vb}; I3 = (V_A−V_B)/R3 = {i3}. La fuente entrega Ps = Vs·(Vs−V_A)/R1 = {ps}.', en: 'Node A: (V_A−Vs)/R1 + V_A/R2 + (V_A−V_B)/R3 = 0. Node B: (V_B−V_A)/R3 + V_B/R4 = Is. Solving: V_A = {va} and V_B = {vb}; I3 = (V_A−V_B)/R3 = {i3}. The source delivers Ps = Vs·(Vs−V_A)/R1 = {ps}.'},
 oraculo: v => { const [A, B] = cramer(1 / v.R1 + 1 / v.R2 + 1 / v.R3, -1 / v.R3, -1 / v.R3, 1 / v.R3 + 1 / v.R4, v.Vs / v.R1, v.Is); return {va: A, vb: B, i3: (A - B) / v.R3, ps: v.Vs * (v.Vs - A) / v.R1}; }},
{id: 'mallas-2', tema: 'metodos', nivel: 2, titulo: {es: 'Método de las mallas (dos mallas)', en: 'Mesh analysis (two meshes)'},
 enun: {es: 'En el circuito de dos mallas, V1 = {V1}, V2 = {V2}, R1 = {R1}, R2 = {R2} y R3 = {R3}. Calcula las corrientes por R1 (hacia la derecha), R2 (hacia abajo) y R3 (hacia la derecha), la tensión del nudo A y la potencia que entrega V1.', en: 'In the two-mesh circuit, V1 = {V1}, V2 = {V2}, R1 = {R1}, R2 = {R2} and R3 = {R3}. Find the currents through R1 (rightward), R2 (downward) and R3 (rightward), the voltage at node A and the power delivered by V1.'},
 params: {V1: VS(6, 9, 12, 15), V2: VS(3, 5, 6, 9), R1: R12(100, 2200), R2: R12(100, 2200), R3: R12(100, 2200)},
 dsl: 'V V1 0,0 0,6 {V1}\nR R1 0,0 5,0 {R1}\nR R2 5,0 5,6 {R2}\nR R3 5,0 10,0 {R3}\nV V2 10,0 10,6 {V2}\nW 0,6 10,6\nGND 5,6\nLBL 5,0 A',
 pedir: [{id: 'i1', nom: 'I_1', txt: {es: 'Corriente por R1', en: 'Current through R1'}, m: {t: 'I', e: 'R1'}, u: 'A'}, {id: 'i2', nom: 'I_2', txt: {es: 'Corriente por R2', en: 'Current through R2'}, m: {t: 'I', e: 'R2'}, u: 'A'}, {id: 'i3', nom: 'I_3', txt: {es: 'Corriente por R3', en: 'Current through R3'}, m: {t: 'I', e: 'R3'}, u: 'A'}, {id: 'va', nom: 'V_A', txt: {es: 'Tensión del nudo A', en: 'Voltage at node A'}, m: {t: 'V', a: 'A', b: '0'}, u: 'V'}, {id: 'ps', nom: 'P_1', txt: {es: 'Potencia que entrega V1', en: 'Power delivered by V1'}, m: {t: 'P', e: 'V1', neg: true}, u: 'W'}],
 sol: {es: 'Con mallas: R1+R2 en la malla izquierda y R2+R3 en la derecha, con R2 compartida. Resulta I1 = {i1}, I3 = {i3} e I2 = I1 − I3 = {i2}. V_A = I2·R2 = {va}. V1 entrega P = V1·I1 = {ps}.', en: 'With meshes: R1+R2 in the left mesh and R2+R3 in the right one, with R2 shared. This gives I1 = {i1}, I3 = {i3} and I2 = I1 − I3 = {i2}. V_A = I2·R2 = {va}. V1 delivers P = V1·I1 = {ps}.'},
 oraculo: v => { const A = (v.V1 / v.R1 + v.V2 / v.R3) / (1 / v.R1 + 1 / v.R2 + 1 / v.R3), i1 = (v.V1 - A) / v.R1; return {i1, i2: A / v.R2, i3: (A - v.V2) / v.R3, va: A, ps: v.V1 * i1}; }},
{id: 'nudos-dep', tema: 'metodos', nivel: 3, titulo: {es: 'Nudos con fuente dependiente', en: 'Nodal analysis with a dependent source'},
 enun: {es: 'El circuito contiene una fuente de corriente controlada por tensión G1 = gm·V_A, con gm = {gm} (la corriente sale del nudo B hacia tierra). Con Vs = {Vs}, R1 = {R1}, R2 = {R2}, R3 = {R3} y R4 = {R4}, calcula V_A, V_B, la corriente por R3 (de A a B) y la potencia absorbida por G1 (negativa si la entrega).', en: 'The circuit has a voltage-controlled current source G1 = gm·V_A, with gm = {gm} (the current leaves node B toward ground). With Vs = {Vs}, R1 = {R1}, R2 = {R2}, R3 = {R3} and R4 = {R4}, find V_A, V_B, the current through R3 (A to B) and the power absorbed by G1 (negative if it delivers power).'},
 params: {Vs: VS(6, 10, 12, 24), gm: {v: [0.0005, 0.001, 0.002], u: 'S'}, R1: R12(470, 4700), R2: R12(470, 4700), R3: R12(470, 4700), R4: R12(470, 4700)},
 dsl: 'V Vs 0,0 0,6 {Vs}\nR R1 0,0 5,0 {R1}\nR R2 5,0 5,6 {R2}\nR R3 5,0 10,0 {R3}\nR R4 10,0 10,6 {R4}\nG G1 14,0 14,6 A 0 {gm}\nW 10,0 14,0\nW 0,6 14,6\nGND 7,6\nLBL 5,0 A\nLBL 10,0 B',
 pedir: [{id: 'va', nom: 'V_A', txt: {es: 'Tensión V_A', en: 'Voltage V_A'}, m: {t: 'V', a: 'A', b: '0'}, u: 'V'}, {id: 'vb', nom: 'V_B', txt: {es: 'Tensión V_B', en: 'Voltage V_B'}, m: {t: 'V', a: 'B', b: '0'}, u: 'V'}, {id: 'i3', nom: 'I_3', txt: {es: 'Corriente por R3 (de A a B)', en: 'Current through R3 (A to B)'}, m: {t: 'I', e: 'R3'}, u: 'A'}, {id: 'pg', nom: 'P_G', txt: {es: 'Potencia absorbida por G1', en: 'Power absorbed by G1'}, m: {t: 'P', e: 'G1'}, u: 'W'}],
 errores: [{pid: ['vb', 'i3'], nom: {es: 'Has ignorado la fuente dependiente (la has tratado como un circuito abierto).', en: 'You ignored the dependent source (you treated it as an open circuit).'}, mut: {abrir: ['G1']}}],
 sol: {es: 'La fuente dependiente añade a la ecuación del nudo B el término gm·V_A. Nudo A: (V_A−Vs)/R1 + V_A/R2 + (V_A−V_B)/R3 = 0. Nudo B: (V_B−V_A)/R3 + V_B/R4 + gm·V_A = 0. Resulta V_A = {va}, V_B = {vb}, I3 = {i3} y P_G = V_B·gm·V_A = {pg}.', en: 'The dependent source adds the term gm·V_A to the node B equation. Node A: (V_A−Vs)/R1 + V_A/R2 + (V_A−V_B)/R3 = 0. Node B: (V_B−V_A)/R3 + V_B/R4 + gm·V_A = 0. This gives V_A = {va}, V_B = {vb}, I3 = {i3} and P_G = V_B·gm·V_A = {pg}.'},
 oraculo: v => { const [A, B] = cramer(1 / v.R1 + 1 / v.R2 + 1 / v.R3, -1 / v.R3, -1 / v.R3 + v.gm, 1 / v.R3 + 1 / v.R4, v.Vs / v.R1, 0); return {va: A, vb: B, i3: (A - B) / v.R3, pg: B * v.gm * A}; }},
{id: 'ci-rama', tema: 'metodos', nivel: 3, titulo: {es: 'Fuente de corriente en una rama (supermalla)', en: 'Current source in a branch (supermesh)'},
 enun: {es: 'En la figura, V1 = {V1}, Is = {Is}, R1 = {R1}, R2 = {R2} y R3 = {R3}. La fuente de corriente extrae Is del nudo A hacia tierra. Calcula V_A, V_B, la corriente por R2 (de A a B) y la potencia absorbida por la fuente de corriente.', en: 'In the figure, V1 = {V1}, Is = {Is}, R1 = {R1}, R2 = {R2} and R3 = {R3}. The current source draws Is from node A to ground. Find V_A, V_B, the current through R2 (A to B) and the power absorbed by the current source.'},
 params: {V1: VS(6, 9, 12, 15, 24), Is: {v: [0.002, 0.005, 0.01], u: 'A'}, R1: R12(220, 4700), R2: R12(220, 4700), R3: R12(220, 4700)},
 dsl: 'V V1 0,0 0,6 {V1}\nR R1 0,0 5,0 {R1}\nI Is 5,0 5,6 {Is}\nR R2 5,0 10,0 {R2}\nR R3 10,0 10,6 {R3}\nW 0,6 10,6\nGND 5,6\nLBL 5,0 A\nLBL 10,0 B',
 pedir: [{id: 'va', nom: 'V_A', txt: {es: 'Tensión V_A', en: 'Voltage V_A'}, m: {t: 'V', a: 'A', b: '0'}, u: 'V', noCero: true}, {id: 'vb', nom: 'V_B', txt: {es: 'Tensión V_B', en: 'Voltage V_B'}, m: {t: 'V', a: 'B', b: '0'}, u: 'V', noCero: true}, {id: 'i2', nom: 'I_2', txt: {es: 'Corriente por R2 (de A a B)', en: 'Current through R2 (A to B)'}, m: {t: 'I', e: 'R2'}, u: 'A'}, {id: 'pi', nom: 'P_I', txt: {es: 'Potencia absorbida por la fuente de corriente', en: 'Power absorbed by the current source'}, m: {t: 'P', e: 'Is'}, u: 'W'}],
 sol: {es: 'La fuente de corriente impone Is en su rama, así que no hay una malla independiente a su alrededor (supermalla). Por nudos: (V_A−V1)/R1 + Is + (V_A−V_B)/R2 = 0 y (V_B−V_A)/R2 + V_B/R3 = 0. Resulta V_A = {va}, V_B = {vb}, I2 = {i2} y P_I = V_A·Is = {pi}.', en: 'The current source forces Is in its branch, so there is no independent mesh around it (supermesh). By nodes: (V_A−V1)/R1 + Is + (V_A−V_B)/R2 = 0 and (V_B−V_A)/R2 + V_B/R3 = 0. This gives V_A = {va}, V_B = {vb}, I2 = {i2} and P_I = V_A·Is = {pi}.'},
 oraculo: v => { const [A, B] = cramer(1 / v.R1 + 1 / v.R2, -1 / v.R2, -1 / v.R2, 1 / v.R2 + 1 / v.R3, v.V1 / v.R1 - v.Is, 0); return {va: A, vb: B, i2: (A - B) / v.R2, pi: A * v.Is}; }},
{id: 'superpos', tema: 'teoremas', nivel: 2, titulo: {es: 'Teorema de superposición', en: 'Superposition theorem'},
 enun: {es: 'Con Vs = {Vs}, Is = {Is}, R1 = {R1}, R2 = {R2}, R3 = {R3} y R4 = {R4}, calcula V_A aplicando superposición: la contribución de la fuente de tensión (con la de corriente apagada), la de la fuente de corriente (con la de tensión apagada) y el valor total. Calcula también V_B total.', en: 'With Vs = {Vs}, Is = {Is}, R1 = {R1}, R2 = {R2}, R3 = {R3} and R4 = {R4}, use superposition to find V_A: the contribution of the voltage source (current source turned off), that of the current source (voltage source turned off) and the total. Also find the total V_B.'},
 params: {Vs: VS(6, 9, 12, 15, 24), Is: {v: [0.002, 0.005, 0.01], u: 'A'}, R1: R12(220, 4700), R2: R12(220, 4700), R3: R12(220, 4700), R4: R12(220, 4700)},
 dsl: 'V Vs 0,0 0,6 {Vs}\nR R1 0,0 5,0 {R1}\nR R2 5,0 5,6 {R2}\nR R3 5,0 10,0 {R3}\nR R4 10,0 10,6 {R4}\nW 10,0 14,0\nI Is 14,6 14,0 {Is}\nW 0,6 14,6\nGND 7,6\nLBL 5,0 A\nLBL 10,0 B',
 pedir: [{id: 'vav', nom: "V_A'", txt: {es: 'V_A debida solo a Vs', en: 'V_A due to Vs alone'}, m: {t: 'V', a: 'A', b: '0', solo: ['Vs']}, u: 'V'}, {id: 'vai', nom: "V_A''", txt: {es: 'V_A debida solo a Is', en: 'V_A due to Is alone'}, m: {t: 'V', a: 'A', b: '0', solo: ['Is']}, u: 'V'}, {id: 'va', nom: 'V_A', txt: {es: 'V_A total', en: 'Total V_A'}, m: {t: 'V', a: 'A', b: '0'}, u: 'V'}, {id: 'vb', nom: 'V_B', txt: {es: 'V_B total', en: 'Total V_B'}, m: {t: 'V', a: 'B', b: '0'}, u: 'V'}],
 errores: [{pid: ['vai'], nom: {es: 'Has apagado la fuente de tensión dejándola en circuito abierto; debe sustituirse por un cortocircuito.', en: 'You turned off the voltage source by leaving it open; it must be replaced by a short circuit.'}, mut: {abrir: ['Vs']}}, {pid: ['vav'], nom: {es: 'Has apagado la fuente de corriente cortocircuitándola; debe dejarse en circuito abierto.', en: 'You turned off the current source by shorting it; it must be left open.'}, mut: {corto: ['Is']}}],
 sol: {es: 'Superposición: con solo Vs (Is abierta) V_A\' = {vav}. Con solo Is (Vs en cortocircuito) V_A\'\' = {vai}. Suma: V_A = {va}. Para V_B total se obtiene {vb}. Se comprueba que coincide con el análisis directo por nudos.', en: 'Superposition: with Vs alone (Is open) V_A\' = {vav}. With Is alone (Vs shorted) V_A\'\' = {vai}. Sum: V_A = {va}. The total V_B is {vb}. It matches the direct nodal analysis.'},
 oraculo: v => { const f = (Vs, Is) => cramer(1 / v.R1 + 1 / v.R2 + 1 / v.R3, -1 / v.R3, -1 / v.R3, 1 / v.R3 + 1 / v.R4, Vs / v.R1, Is), a = f(v.Vs, 0), b = f(0, v.Is), t = f(v.Vs, v.Is); return {vav: a[0], vai: b[0], va: t[0], vb: t[1]}; }},
{id: 'thevenin', tema: 'teoremas', nivel: 2, titulo: {es: 'Equivalente de Thévenin', en: 'Thévenin equivalent'},
 enun: {es: 'Con Vs = {Vs}, R1 = {R1}, R2 = {R2} y R3 = {R3}, halla el equivalente de Thévenin visto por la carga RL = {RL} entre el terminal A y tierra. Calcula Vth, Rth y, con ellos, la corriente y la potencia en RL.', en: 'With Vs = {Vs}, R1 = {R1}, R2 = {R2} and R3 = {R3}, find the Thévenin equivalent seen by the load RL = {RL} between terminal A and ground. Find Vth and Rth and, with them, the current and power in RL.'},
 params: {Vs: VS(6, 9, 12, 15, 24), R1: R12(220, 4700), R2: R12(220, 4700), R3: R12(220, 4700), RL: R12(100, 2200)},
 dsl: 'V Vs 0,0 0,6 {Vs}\nR R1 0,0 5,0 {R1}\nR R2 5,0 5,6 {R2}\nR R3 5,0 10,0 {R3}\nR RL 10,0 10,6 {RL}\nW 0,6 10,6\nGND 5,6\nLBL 5,0 N\nLBL 10,0 A',
 pedir: [{id: 'vth', nom: 'V_th', txt: {es: 'Tensión de Thévenin (RL desconectada)', en: 'Thévenin voltage (RL disconnected)'}, m: {t: 'Vth', a: 'A', b: '0', quitar: ['RL']}, u: 'V'}, {id: 'rth', nom: 'R_th', txt: {es: 'Resistencia de Thévenin', en: 'Thévenin resistance'}, m: {t: 'Req', a: 'A', b: '0', quitar: ['RL']}, u: 'Ω'}, {id: 'il', nom: 'I_L', txt: {es: 'Corriente por RL', en: 'Current through RL'}, m: {t: 'I', e: 'RL'}, u: 'A'}, {id: 'pl', nom: 'P_L', txt: {es: 'Potencia en RL', en: 'Power in RL'}, m: {t: 'P', e: 'RL'}, u: 'W'}],
 errores: [{pid: ['rth'], nom: {es: 'Has olvidado R1 al calcular Rth (queda en paralelo con R2 cuando la fuente se apaga).', en: 'You forgot R1 when computing Rth (it ends up in parallel with R2 once the source is turned off).'}, mut: {abrir: ['R1']}}, {pid: ['rth'], nom: {es: 'Has omitido R3 al calcular Rth; está en serie con el paralelo R1∥R2.', en: 'You left out R3 in Rth; it is in series with R1∥R2.'}, mut: {corto: ['R3']}}, {pid: ['vth'], nom: {es: 'Has restado la caída en R3, pero por R3 no circula corriente en vacío.', en: 'You subtracted a drop across R3, but no current flows through R3 at open circuit.'}, mut: {}}],
 sol: {es: 'En vacío no circula corriente por R3, luego Vth = Vs·R2/(R1+R2) = {vth}. Con la fuente en cortocircuito, Rth = R3 + R1∥R2 = {rth}. El equivalente alimenta a RL: I_L = Vth/(Rth+RL) = {il} y P_L = {pl}.', en: 'At open circuit no current flows through R3, so Vth = Vs·R2/(R1+R2) = {vth}. With the source shorted, Rth = R3 + R1∥R2 = {rth}. The equivalent drives RL: I_L = Vth/(Rth+RL) = {il} and P_L = {pl}.'},
 oraculo: v => { const vth = v.Vs * v.R2 / (v.R1 + v.R2), rth = v.R3 + v.R1 * v.R2 / (v.R1 + v.R2), il = vth / (rth + v.RL); return {vth, rth, il, pl: sq(il) * v.RL}; }},
{id: 'norton-max', tema: 'teoremas', nivel: 3, titulo: {es: 'Norton y máxima transferencia de potencia', en: 'Norton and maximum power transfer'},
 enun: {es: 'Con Vs = {Vs}, R1 = {R1}, R2 = {R2} y R3 = {R3}, calcula el equivalente de Norton entre A y tierra (corriente de Norton y resistencia), el valor de RL que maximiza la potencia transferida, esa potencia máxima y la potencia que recibe la carga actual RL = {RL}.', en: 'With Vs = {Vs}, R1 = {R1}, R2 = {R2} and R3 = {R3}, find the Norton equivalent between A and ground (Norton current and resistance), the value of RL that maximises the transferred power, that maximum power and the power received by the present load RL = {RL}.'},
 params: {Vs: VS(6, 9, 12, 15, 24), R1: R12(220, 4700), R2: R12(220, 4700), R3: R12(220, 4700), RL: R12(100, 2200)},
 dsl: 'V Vs 0,0 0,6 {Vs}\nR R1 0,0 5,0 {R1}\nR R2 5,0 5,6 {R2}\nR R3 5,0 10,0 {R3}\nR RL 10,0 10,6 {RL}\nW 0,6 10,6\nGND 5,6\nLBL 5,0 N\nLBL 10,0 A',
 pedir: [{id: 'in', nom: 'I_N', txt: {es: 'Corriente de Norton (cortocircuito entre A y tierra, de A a tierra)', en: 'Norton current (short between A and ground, A to ground)'}, m: {t: 'In', a: 'A', b: '0', quitar: ['RL']}, u: 'A'}, {id: 'rn', nom: 'R_N', txt: {es: 'Resistencia de Norton', en: 'Norton resistance'}, m: {t: 'Req', a: 'A', b: '0', quitar: ['RL']}, u: 'Ω'}, {id: 'pmax', nom: 'P_max', txt: {es: 'Potencia máxima transferible a la carga', en: 'Maximum power transferable to the load'}, m: {t: 'Pmax', a: 'A', b: '0', quitar: ['RL']}, u: 'W'}, {id: 'pl', nom: 'P_L', txt: {es: 'Potencia en la carga actual RL', en: 'Power in the present load RL'}, m: {t: 'P', e: 'RL'}, u: 'W'}],
 sol: {es: 'La corriente de Norton es la de cortocircuito: I_N = {in}; la resistencia es la misma que la de Thévenin, R_N = {rn}. La transferencia máxima ocurre con RL = R_N y vale P_max = Vth²/(4·R_N) = {pmax}. Con la carga actual, P_L = {pl}.', en: 'The Norton current is the short-circuit current: I_N = {in}; the resistance equals the Thévenin one, R_N = {rn}. Maximum transfer happens at RL = R_N and equals P_max = Vth²/(4·R_N) = {pmax}. With the present load, P_L = {pl}.'},
 oraculo: v => { const vth = v.Vs * v.R2 / (v.R1 + v.R2), rth = v.R3 + v.R1 * v.R2 / (v.R1 + v.R2), il = vth / (rth + v.RL); return {in: vth / rth, rn: rth, pmax: sq(vth) / (4 * rth), pl: sq(il) * v.RL}; }},
{id: 'oa-inv', tema: 'oa', nivel: 2, titulo: {es: 'Amplificador inversor', en: 'Inverting amplifier'},
 enun: {es: 'El amplificador operacional de la figura se considera ideal. Con Vi = {Vi}, Rin = {Rin} y Rf = {Rf}, calcula la tensión de salida, la ganancia, la corriente por Rf (de N hacia la salida) y razona si el operacional satura con alimentación de ±12 V.', en: 'The op-amp in the figure is ideal. With Vi = {Vi}, Rin = {Rin} and Rf = {Rf}, find the output voltage, the gain, the current through Rf (from N toward the output) and decide whether the op-amp saturates with ±12 V supplies.'},
 params: {Vi: {v: [0.1, 0.2, 0.25, 0.5, 1, 1.5, 2], u: 'V'}, Rin: R12(1000, 10000), Rf: R12(2200, 100000)},
 dsl: 'V Vi 0,0 0,4 {Vi}\nR Rin 0,0 4,0 {Rin}\nW 4,0 4,-1 9,-1\nW 4,-1 4,-4\nR Rf 4,-4 12,-4 {Rf}\nW 12,-4 12,0\nOA U1 12,0\nW 9,1 9,4\nGND 9,4\nGND 0,4\nLBL 12,0 Vo\nLBL 4,-1 N',
 pedir: [{id: 'vo', nom: 'V_o', txt: {es: 'Tensión de salida', en: 'Output voltage'}, m: {t: 'V', a: 'Vo', b: '0'}, u: 'V', rango: [0.05, 40]}, {id: 'g', nom: 'A_v', txt: {es: 'Ganancia de tensión V_o/V_i', en: 'Voltage gain V_o/V_i'}, m: {t: 'expr', e: '{vo}/{Vi}'}, u: ''}, {id: 'irf', nom: 'I_f', txt: {es: 'Corriente por Rf', en: 'Current through Rf'}, m: {t: 'I', e: 'Rf'}, u: 'A'}, {id: 'sat', tipo: 'op', txt: {es: '¿Satura con ±12 V?', en: 'Does it saturate with ±12 V?'}, opciones: {es: ['Sí, satura', 'No, no satura'], en: ['Yes, it saturates', 'No, it does not']}, cond: {m: 'vo', abs: true, gt: 12, si: 0, no: 1}}],
 errores: [{pid: ['vo'], nom: {es: 'Has usado la ganancia del no inversor (1+Rf/Rin) o has olvidado el signo negativo.', en: 'You used the non-inverting gain (1+Rf/Rin) or forgot the minus sign.'}, mut: {}}],
 sol: {es: 'La entrada − es tierra virtual: la corriente Vi/Rin = {irf} atraviesa Rf. Por tanto Vo = −(Rf/Rin)·Vi = {vo} y la ganancia es {g}. La salida no puede superar la alimentación (±12 V): por eso satura si |Vo| > 12 V.', en: 'The − input is a virtual ground: the current Vi/Rin = {irf} flows through Rf. Hence Vo = −(Rf/Rin)·Vi = {vo} and the gain is {g}. The output cannot exceed the supply (±12 V): it saturates if |Vo| > 12 V.'},
 oraculo: v => ({vo: -v.Vi * v.Rf / v.Rin, g: -v.Rf / v.Rin, irf: v.Vi / v.Rin})},
{id: 'oa-noinv', tema: 'oa', nivel: 2, titulo: {es: 'Amplificador no inversor', en: 'Non-inverting amplifier'},
 enun: {es: 'El operacional es ideal. Con Vi = {Vi}, Rf = {Rf} y Rg = {Rg}, calcula la tensión de salida, la ganancia, la corriente por Rg (hacia tierra) y razona si satura con alimentación de ±12 V.', en: 'The op-amp is ideal. With Vi = {Vi}, Rf = {Rf} and Rg = {Rg}, find the output voltage, the gain, the current through Rg (toward ground) and decide whether it saturates with ±12 V supplies.'},
 params: {Vi: {v: [0.1, 0.2, 0.25, 0.5, 1, 1.5], u: 'V'}, Rf: R12(2200, 100000), Rg: R12(1000, 10000)},
 dsl: 'V Vi 0,1 0,6 {Vi}\nW 0,1 9,1\nOA U1 12,0\nW 9,-1 6,-1\nW 6,-1 6,-3\nR Rf 6,-3 12,-3 {Rf}\nW 12,-3 12,0\nR Rg 6,-1 6,6 {Rg}\nGND 6,6\nGND 0,6\nX 6,1\nLBL 12,0 Vo\nLBL 6,-1 N',
 pedir: [{id: 'vo', nom: 'V_o', txt: {es: 'Tensión de salida', en: 'Output voltage'}, m: {t: 'V', a: 'Vo', b: '0'}, u: 'V', rango: [0.05, 40]}, {id: 'g', nom: 'A_v', txt: {es: 'Ganancia de tensión', en: 'Voltage gain'}, m: {t: 'expr', e: '{vo}/{Vi}'}, u: ''}, {id: 'ig', nom: 'I_g', txt: {es: 'Corriente por Rg', en: 'Current through Rg'}, m: {t: 'I', e: 'Rg'}, u: 'A'}, {id: 'sat', tipo: 'op', txt: {es: '¿Satura con ±12 V?', en: 'Does it saturate with ±12 V?'}, opciones: {es: ['Sí, satura', 'No, no satura'], en: ['Yes, it saturates', 'No, it does not']}, cond: {m: 'vo', abs: true, gt: 12, si: 0, no: 1}}],
 sol: {es: 'Las entradas están al mismo potencial: V_N = Vi. Rg y Rf forman un divisor: la corriente por Rg es Vi/Rg = {ig}. Vo = (1 + Rf/Rg)·Vi = {vo} y la ganancia es {g}.', en: 'The inputs are at the same potential: V_N = Vi. Rg and Rf form a divider: the current through Rg is Vi/Rg = {ig}. Vo = (1 + Rf/Rg)·Vi = {vo} and the gain is {g}.'},
 oraculo: v => ({vo: v.Vi * (1 + v.Rf / v.Rg), g: 1 + v.Rf / v.Rg, ig: v.Vi / v.Rg})},
{id: 'rc-carga', tema: 'trans', nivel: 2, titulo: {es: 'Carga de un condensador (RC)', en: 'Charging a capacitor (RC)'},
 enun: {es: 'El condensador C1 = {C} está descargado. En t = 0 se cierra el interruptor S1 y la fuente Vs = {Vs} carga el condensador a través de R1 = {R1}. Calcula la constante de tiempo, la tensión del condensador en t = {t1}, la corriente en ese instante, la tensión final y el tiempo que tarda en alcanzar el {px} % de la tensión final.', en: 'Capacitor C1 = {C} is initially discharged. At t = 0 switch S1 closes and the source Vs = {Vs} charges the capacitor through R1 = {R1}. Find the time constant, the capacitor voltage at t = {t1}, the current at that instant, the final voltage and the time to reach {px} % of the final voltage.'},
 params: {Vs: VS(5, 9, 12, 24), R1: R12(1000, 100000), C: {v: [1e-7, 2.2e-7, 4.7e-7, 1e-6, 2.2e-6, 4.7e-6, 1e-5], u: 'F'}, k: {v: [0.5, 1, 2, 3]}, t1: {expr: 'sig({k}*{R1}*{C},2)', u: 's'}, px: {v: [50, 63.2, 80, 90, 95], u: '%'}},
 dsl: 'V Vs 0,0 0,6 {Vs}\nSW S1 0,0 4,0 abierto\nR R1 4,0 9,0 {R1}\nC C1 9,0 9,6 {C}\nW 0,6 9,6\nGND 4,6\nLBL 9,0 Vc\nT 1,-1 t = 0',
 trans: {ic: {C1: 0}, antes: {sw: {S1: 'abierto'}}, despues: {sw: {S1: 'cerrado'}}},
 calc: [{id: 'tau', m: {t: 'tau'}, u: 's'}],
 pedir: [{id: 'tau', nom: 'τ', txt: {es: 'Constante de tiempo', en: 'Time constant'}, m: {t: 'tau'}, u: 's'}, {id: 'vc1', nom: 'v_C(t₁)', txt: {es: 'Tensión del condensador en t₁', en: 'Capacitor voltage at t₁'}, m: {t: 'tv', e: 'C1', tiempo: '{t1}'}, u: 'V'}, {id: 'i1', nom: 'i(t₁)', txt: {es: 'Corriente de carga en t₁', en: 'Charging current at t₁'}, m: {t: 'ti', e: 'C1', tiempo: '{t1}'}, u: 'A'}, {id: 'vinf', nom: 'v_C(∞)', txt: {es: 'Tensión final del condensador', en: 'Final capacitor voltage'}, m: {t: 'V', e: 'C1', cuando: 'inf'}, u: 'V'}, {id: 'tx', nom: 't_x', txt: {es: 'Tiempo para alcanzar el porcentaje indicado', en: 'Time to reach the stated percentage'}, m: {t: 'expr', e: '-{tau}*ln(1-{px}/100)'}, u: 's'}],
 errores: [{pid: ['vc1'], nom: {es: 'Has usado v = Vs·e^(−t/τ) (descarga) en lugar de v = Vs·(1 − e^(−t/τ)) (carga).', en: 'You used v = Vs·e^(−t/τ) (discharge) instead of v = Vs·(1 − e^(−t/τ)) (charge).'}, mut: {}}],
 sol: {es: 'τ = R1·C = {tau}. El condensador parte de 0 y tiende a Vs: v_C(t) = Vs·(1 − e^(−t/τ)). En t₁ vale {vc1} y la corriente i = (Vs/R1)·e^(−t/τ) = {i1}. Tensión final: {vinf}. El {px} % se alcanza en t = −τ·ln(1 − {px}/100) = {tx}.', en: 'τ = R1·C = {tau}. The capacitor starts at 0 and tends to Vs: v_C(t) = Vs·(1 − e^(−t/τ)). At t₁ it is {vc1} and the current i = (Vs/R1)·e^(−t/τ) = {i1}. Final voltage: {vinf}. {px} % is reached at t = −τ·ln(1 − {px}/100) = {tx}.'},
 oraculo: v => { const tau = v.R1 * v.C; return {tau, vc1: v.Vs * (1 - Math.exp(-v.t1 / tau)), i1: v.Vs / v.R1 * Math.exp(-v.t1 / tau), vinf: v.Vs, tx: -tau * Math.log(1 - v.px / 100)}; }},
{id: 'rl-corte', tema: 'trans', nivel: 2, titulo: {es: 'Descarga de una bobina (RL)', en: 'Inductor discharge (RL)'},
 enun: {es: 'El circuito lleva mucho tiempo con Vs = {Vs}. En t = 0 la fuente pasa a 0 V (se sustituye por un cortocircuito). Con R1 = {R1}, R2 = {R2} y L = {L}, calcula la corriente de la bobina justo antes del cambio, la constante de tiempo, la corriente en t = {t1} y la tensión en R2 en ese instante.', en: 'The circuit has been running for a long time with Vs = {Vs}. At t = 0 the source drops to 0 V (replaced by a short circuit). With R1 = {R1}, R2 = {R2} and L = {L}, find the inductor current just before the change, the time constant, the current at t = {t1} and the voltage across R2 at that instant.'},
 params: {Vs: VS(6, 10, 12, 24), R1: R12(22, 470), R2: R12(47, 1000), L: {v: [0.01, 0.02, 0.05, 0.1, 0.2], u: 'H'}, k: {v: [0.5, 1, 2]}, t1: {expr: 'sig({k}*{L}/({R1}+{R2}),2)', u: 's'}},
 dsl: 'V Vs 0,0 0,6 {Vs}\nR R1 0,0 4,0 {R1}\nL L1 4,0 8,0 {L}\nR R2 8,0 8,6 {R2}\nW 0,6 8,6\nGND 4,6\nLBL 4,0 A\nT 1,-1 Vs: {Vs|V} → 0 V en t = 0',
 trans: {antes: {val: {Vs: '{Vs}'}}, despues: {val: {Vs: '0'}}},
 pedir: [{id: 'i0', nom: 'i(0⁻)', txt: {es: 'Corriente de la bobina antes del cambio', en: 'Inductor current before the change'}, m: {t: 'I', e: 'L1', cuando: '0-'}, u: 'A'}, {id: 'tau', nom: 'τ', txt: {es: 'Constante de tiempo', en: 'Time constant'}, m: {t: 'tau'}, u: 's'}, {id: 'i1', nom: 'i(t₁)', txt: {es: 'Corriente de la bobina en t₁', en: 'Inductor current at t₁'}, m: {t: 'ti', e: 'L1', tiempo: '{t1}'}, u: 'A'}, {id: 'vr2', nom: 'v_R2(t₁)', txt: {es: 'Tensión en R2 en t₁ (de arriba abajo)', en: 'Voltage across R2 at t₁ (top to bottom)'}, m: {t: 'tv', e: 'R2', tiempo: '{t1}'}, u: 'V'}],
 sol: {es: 'Antes del cambio la bobina es un cortocircuito: i(0⁻) = Vs/(R1+R2) = {i0}. La corriente de la bobina es continua. Con la fuente anulada, τ = L/(R1+R2) = {tau} y i(t) = i(0)·e^(−t/τ): en t₁ vale {i1}. Entonces v_R2 = i·R2 = {vr2}.', en: 'Before the change the inductor is a short circuit: i(0⁻) = Vs/(R1+R2) = {i0}. The inductor current is continuous. With the source cancelled, τ = L/(R1+R2) = {tau} and i(t) = i(0)·e^(−t/τ): at t₁ it is {i1}. Then v_R2 = i·R2 = {vr2}.'},
 oraculo: v => { const tau = v.L / (v.R1 + v.R2), i0 = v.Vs / (v.R1 + v.R2), i1 = i0 * Math.exp(-v.t1 / tau); return {i0, tau, i1, vr2: i1 * v.R2}; }},
{id: 'rc-th', tema: 'trans', nivel: 3, titulo: {es: 'Transitorio RC con equivalente de Thévenin', en: 'RC transient with Thévenin equivalent'},
 enun: {es: 'El condensador C1 = {C} está descargado. En t = 0 se cierra S1. Con Vs = {Vs}, R1 = {R1}, R2 = {R2} y R3 = {R3}, calcula la resistencia que ve el condensador, la constante de tiempo, la tensión final y la tensión del condensador en t = {t1}.', en: 'Capacitor C1 = {C} is initially discharged. At t = 0, S1 closes. With Vs = {Vs}, R1 = {R1}, R2 = {R2} and R3 = {R3}, find the resistance seen by the capacitor, the time constant, the final voltage and the capacitor voltage at t = {t1}.'},
 params: {Vs: VS(6, 9, 12, 24), R1: R12(1000, 22000), R2: R12(1000, 22000), R3: R12(1000, 22000), C: {v: [1e-7, 2.2e-7, 4.7e-7, 1e-6, 2.2e-6], u: 'F'}, k: {v: [0.5, 1, 2, 3]}, t1: {expr: 'sig({k}*({R3}+{R1}*{R2}/({R1}+{R2}))*{C},2)', u: 's'}},
 dsl: 'V Vs 0,0 0,6 {Vs}\nR R1 0,0 5,0 {R1}\nR R2 5,0 5,6 {R2}\nSW S1 5,0 9,0 abierto\nR R3 9,0 13,0 {R3}\nC C1 13,0 13,6 {C}\nW 0,6 13,6\nGND 5,6\nLBL 13,0 Vc\nLBL 5,0 A\nT 6,-1 t = 0',
 trans: {ic: {C1: 0}, antes: {sw: {S1: 'abierto'}}, despues: {sw: {S1: 'cerrado'}}},
  pedir: [{id: 'rth', nom: 'R_th', txt: {es: 'Resistencia de Thévenin vista por C1 (con S1 cerrado)', en: 'Thévenin resistance seen by C1 (S1 closed)'}, m: {t: 'Req', a: 'Vc', b: '0', quitar: ['C1']}, u: 'Ω'}, {id: 'tau', nom: 'τ', txt: {es: 'Constante de tiempo', en: 'Time constant'}, m: {t: 'tau'}, u: 's'}, {id: 'vinf', nom: 'v_C(∞)', txt: {es: 'Tensión final de C1', en: 'Final voltage of C1'}, m: {t: 'V', e: 'C1', cuando: 'inf'}, u: 'V'}, {id: 'vc1', nom: 'v_C(t₁)', txt: {es: 'Tensión de C1 en t₁', en: 'Voltage of C1 at t₁'}, m: {t: 'tv', e: 'C1', tiempo: '{t1}'}, u: 'V'}],

{id: 'rlc-sub', tema: 'segundo', nivel: 3, titulo: {es: 'RLC serie subamortiguado (escalón)', en: 'Underdamped series RLC (step)'},

 trans: {ic: {C1: 0, L1: 0}, antes: {sw: {S1: 'abierto'}}, despues: {sw: {S1: 'cerrado'}}},

 pedir: [{id: 'alfa', nom: 'α', txt: {es: 'Coeficiente de amortiguamiento α = R/(2L)', en: 'Damping coefficient α = R/(2L)'}, m: {t: 'expr', e: '{R1}/(2*{L})'}, u: 's⁻¹'}, {id: 'w0', nom: 'ω₀', txt: {es: 'Frecuencia natural ω₀', en: 'Natural frequency ω₀'}, m: {t: 'expr', e: '1/sqrt({L}*{C})'}, u: 'rad/s'}, {id: 'wd', nom: 'ω_d', txt: {es: 'Frecuencia amortiguada ω_d', en: 'Damped frequency ω_d'}, m: {t: 'expr', e: 'sqrt({w0}*{w0}-{alfa}*{alfa})'}, u: 'rad/s'}, {id: 'sob', nom: 'M_p', txt: {es: 'Sobreimpulso máximo', en: 'Maximum overshoot'}, m: {t: 'expr', e: '100*exp(-pi*{alfa}/{wd})'}, u: '%'}, {id: 'vc1', nom: 'v_C(t₁)', txt: {es: 'Tensión del condensador en t₁', en: 'Capacitor voltage at t₁'}, m: {t: 'tv', e: 'C1', tiempo: '{t1}'}, u: 'V'}],
 errores: [{pid: ['wd'], nom: {es: 'Has dado ω₀ en lugar de ω_d = √(ω₀² − α²).', en: 'You gave ω₀ instead of ω_d = √(ω₀² − α²).'}, mut: {}}],

 sol: {es: 'ω = 2πf. Z = R + j(ωL − 1/ωC): |Z| = {zm}, ∠Z = {zf}. Con la fuente en fase 0: |I| = |V|/|Z| = {im} con fase {if}. |V_C| = |I|/(ωC) = {vc}. Con valores eficaces P = I²R = {p} y cos φ = {fp}.', en: 'ω = 2πf. Z = R + j(ωL − 1/ωC): |Z| = {zm}, ∠Z = {zf}. With the source at phase 0: |I| = |V|/|Z| = {im} with phase {if}. |V_C| = |I|/(ωC) = {vc}. With RMS values P = I²R = {p} and cos φ = {fp}.'},

      for (const s of sol) { for (let k = -12; k <= 12; k++) { const c = s * Math.pow(10, k); if (Math.abs(x - c) <= 0.007 * c) { malo = true; break; } } if (malo) break; } if (malo) break;

async function propuestaPlantilla(enun) {
  const user = 'ENUNCIADO DEL PROBLEMA / PROBLEM STATEMENT\n' + enun;
  if (!await confirmaEnvio(t('envioPlantilla'), user)) return null;
  let tpl = null, intento = 0, msgs = [{role: 'system', content: PROMPT_PLANTILLA}, {role: 'user', content: user}];
  for (; intento < 2; intento++) {
    const j = await llmJSON(msgs, {max: 3200}); if (!j || typeof j !== 'object') throw new Error(t('iaNoJson')); tpl = j; tpl.nivel = +tpl.nivel || 2; tpl.sol = tpl.sol || {es: '', en: ''};
    const v = validaPlantilla(tpl); if (!v.errores.length) return {tpl, v, intentos: intento + 1};
    msgs = msgs.concat([{role: 'assistant', content: JSON.stringify(j)}, {role: 'user', content: 'The app rejected the template with these errors. Fix them and reply with the full corrected JSON only:\n- ' + v.errores.join('\n- ')}]);
  }
  return {tpl, v: validaPlantilla(tpl), intentos: intento};
}
